      <span class="heart-pulse" aria-hidden="true">💗</span>
      <span>Operation Drashti — Official Smile Sanctuary</span>
    </div>

    <p class="footer-text">
      Built with Angular, questionable jokes, and genuine good wishes — Jay 💗

    <p class="footer-subtext">
